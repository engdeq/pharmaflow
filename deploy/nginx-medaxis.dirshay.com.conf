# MedAxis Control Center + Pharmacy SaaS
# https://medaxis.dirshay.com  →  SPA + /api → :5010
# Keep http://IP:8090 as emergency fallback (sites-available/pharmaflow).

server {
    listen 80;
    listen [::]:80;
    server_name medaxis.dirshay.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medaxis.dirshay.com;
    client_max_body_size 20m;

    # Certificates are installed/renewed by Certbot.
    ssl_certificate /etc/letsencrypt/live/medaxis.dirshay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medaxis.dirshay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pharmaflow/client/dist;
    index index.html;

    # Pass hostname so API can resolve tenant from subdomain later
    # (e.g. shafi.medaxis.dirshay.com when wildcard is ready).
    location /api/ {
        proxy_pass http://127.0.0.1:5010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Host $host;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

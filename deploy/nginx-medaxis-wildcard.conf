# Wildcard pharmacy tenants: *.medaxis.dirshay.com
# Requires DNS: *.medaxis.dirshay.com  A  2.58.82.168
# Requires cert covering *.medaxis.dirshay.com (DNS-01) OR per-host certbot.
#
# Until wildcard SSL exists, use path links that already work:
#   https://medaxis.dirshay.com/t/{slug}

server {
    listen 80;
    listen [::]:80;
    server_name *.medaxis.dirshay.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.medaxis.dirshay.com;
    client_max_body_size 20m;

    # Replace with wildcard cert when available:
    # ssl_certificate /etc/letsencrypt/live/medaxis.dirshay.com/fullchain.pem;
    # For now, issue per-subdomain: certbot --nginx -d shafi.medaxis.dirshay.com
    ssl_certificate /etc/letsencrypt/live/medaxis.dirshay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medaxis.dirshay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pharmaflow/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
